<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Carlito, sans-serif" font-size="13">
  <line x1="60" y1="280" x2="660" y2="280" stroke="#0a1628" stroke-width="1.5"/>
  <line x1="60" y1="280" x2="60" y2="30" stroke="#0a1628" stroke-width="1.5"/>
  <text x="360" y="310" text-anchor="middle" fill="#555">Number of workers (N)</text>
  <text x="25" y="150" text-anchor="middle" fill="#555" transform="rotate(-90 25 150)">Speedup</text>

  <line x1="60" y1="55" x2="660" y2="55" stroke="#999" stroke-dasharray="6"/>
  <text x="600" y="45" fill="#999">ceiling: 1/(1-p)</text>

  <path d="M 60 280 C 150 200, 250 90, 400 62 S 600 56, 660 55" fill="none" stroke="#C5A059" stroke-width="4"/>

  <text x="20" y="20" font-size="14" font-weight="bold" fill="#0a1628">Amdahl's Law: diminishing returns</text>
  <text x="60" y="300" font-size="11" fill="#555">1</text>
  <text x="640" y="300" font-size="11" fill="#555">many</text>
</svg>
